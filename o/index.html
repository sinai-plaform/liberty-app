<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>הזמנה חוזרת · JaSale</title>
<meta name="theme-color" content="#46647F">
<link rel="icon" type="image/svg+xml" href="/jasale-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Outfit:wght@700&display=swap">
<style>
:root{--bg:#F7F6F3;--sur:#fff;--ink:#1B2B3B;--mut:#616B74;--line:#E6E4DF;--acc:#46647F;--accd:#22384F;--accs:#EEF2F5;--good:#1c7a4f;--goods:#e4f0e8;--warn:#9a6207;--warns:#f8eeda;--bad:#a52f27;--bads:#f7e6e3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Hebrew",Heebo,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 150px}
header{background:var(--acc);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5}
header .in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font:700 15px Outfit,sans-serif;opacity:.9}
.brand img{width:22px;height:22px;border-radius:6px}
h1{font-size:20px;margin:8px 0 2px;letter-spacing:-.01em}
.sub{font-size:12.5px;color:#DFE7EE}
.search{margin-top:12px;display:flex;gap:8px}
.search input{flex:1;height:44px;border-radius:12px;border:none;padding:0 13px;font-size:15px}
.sec{font-size:13px;font-weight:800;color:var(--accd);margin:18px 2px 8px}
.card{background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:11px;align-items:center;margin-bottom:9px}
.thumb{width:58px;height:58px;border-radius:10px;background:var(--accs);flex:none;object-fit:contain}
.info{flex:1;min-width:0}
.nm{font-size:14px;font-weight:700;line-height:1.35}
.meta{font-size:11.5px;color:var(--mut);margin-top:2px}
.price{font-size:14px;font-weight:800;color:var(--accd);margin-top:3px}
.bonus{display:inline-block;background:var(--goods);color:var(--good);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-inline-start:5px}
.last{display:inline-block;background:var(--accs);color:var(--accd);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:700;color:var(--accd);cursor:pointer}
.qty input{width:48px;height:36px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:15px;font-weight:700}
.add{height:36px;border-radius:10px;border:none;background:var(--accs);color:var(--accd);font-weight:800;padding:0 12px;cursor:pointer;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06);z-index:6}
.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cta{height:50px;border:none;border-radius:13px;background:var(--acc);color:#fff;font-size:16px;font-weight:800;cursor:pointer;padding:0 18px}
.cta:disabled{opacity:.45}
.tot{flex:1;min-width:0}.tot b{font-size:18px;color:var(--accd)}.tot div{font-size:11.5px;color:var(--mut)}
.ovl{position:fixed;inset:0;background:rgba(28,26,23,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;margin-top:6px}
.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.msg{text-align:center;padding:60px 20px;color:var(--mut);font-size:15px;line-height:1.7}
.msg .big{font-size:46px}
.note{background:var(--warns);color:var(--warn);border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:700;margin-top:10px}
</style>
</head>
<body>
<header><div class="in">
 <div class="brand"><img src="/jasale-icon.svg" alt=""> <span id="co">JaSale</span></div>
 <h1 id="ttl">הזמנה חוזרת</h1>
 <div class="sub" id="who">טוען…</div>
 <div class="search"><input id="q" type="search" placeholder="חיפוש מוצר או מק״ט…" autocomplete="off"></div>
</div></header>
<div class="wrap" id="main"><div class="msg">טוען את הקטלוג…</div></div>
<div class="bar" id="bar" hidden><div class="in"><div class="tot"><b id="sum">₪0</b><div id="sumd">0 פריטים · לפני מע״מ</div></div><button class="cta" id="go" disabled>שליחת הזמנה</button></div></div>
<script>
(function(){
var SB='https://ooxdupeihzvbzudibaoi.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9veGR1cGVpaHp2Ynp1ZGliYW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTk2ODUsImV4cCI6MjA5MjUzNTY4NX0.-phHZwltk41dIJM6tal9B7t2WZVLrAXLV6is4djN9_A';
var MIN=60000;
function tok(){var q=new URLSearchParams(location.search).get('t');if(q)return q;var m=location.pathname.match(/\/o\/([A-Za-z0-9_\-]{12,40})/);return m?m[1]:'';}
var T=tok(),D=null,qty={},imgs={},asked={};
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
var ils=function(a){return '₪'+(a/100).toLocaleString('he-IL',{maximumFractionDigits:2});};
function rpc(fn,body){return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();});}
function fail(t){$('main').innerHTML='<div class="msg"><div class="big">🔗</div>'+t+'</div>';$('who').textContent='';}
if(!T){fail('הקישור לא תקין. בקשו מהסוכנת קישור חדש.');return;}
try{var saved=JSON.parse(localStorage.getItem('jo_'+T)||'{}');if(saved&&saved.q)qty=saved.q;}catch(e){}
rpc('reorder_get',{p_token:T}).then(function(d){
 if(!d||!d.products){fail('הקישור לא נמצא או שפג תוקפו. בקשו מהסוכנת קישור חדש.');return;}
 D=d;$('co').textContent=d.company?String(d.company).split(' ')[0]+' · JaSale':'JaSale';
 $('ttl').textContent=d.customer.name;$('who').textContent='הזמנה חוזרת'+(d.agent?' · הסוכנת שלכם: '+d.agent:'');
 document.title='הזמנה · '+d.customer.name;$('bar').hidden=false;draw();sum();
},function(){fail('אין חיבור לאינטרנט. נסו שוב בעוד רגע.');});
function bonusOf(p){return (p.bonus_buy>0&&p.bonus_get>0)?('<span class="bonus">'+p.bonus_buy+'+'+p.bonus_get+' בונוס</span>'):'';}
function row(p){var q=qty[p.id]||0;
 return '<div class="card" data-id="'+p.id+'" data-sku="'+esc(p.sku)+'"><img class="thumb" alt="" '+(imgs[p.sku]?'src="'+esc(imgs[p.sku])+'"':'')+'>'+
  '<div class="info"><div class="nm">'+esc(p.name)+'</div><div class="meta">'+esc(p.sku)+(p.pack_size?' · אריזה '+p.pack_size:'')+(p.times?' · <span class="last">הזמנתם '+p.times+'× · אחרון '+(p.last_qty||'')+'</span>':'')+'</div>'+
  '<div class="price">'+ils(p.price_agorot)+bonusOf(p)+'</div></div>'+
  (q>0?'<div class="qty"><button data-d="-1" aria-label="פחות">−</button><input inputmode="numeric" value="'+q+'" aria-label="כמות"><button data-d="1" aria-label="עוד">+</button></div>'
     :'<button class="add" data-add="'+(p.times&&p.last_qty?p.last_qty:1)+'">'+(p.times&&p.last_qty?'+ '+p.last_qty:'+ הוספה')+'</button>')+'</div>';}
function draw(){var s=($('q').value||'').trim().toLowerCase(),prev=[],rest=[];
 D.products.forEach(function(p){if(s&&(p.name||'').toLowerCase().indexOf(s)<0&&(p.sku||'').toLowerCase().indexOf(s)<0)return;(p.times?prev:rest).push(p);});
 var h='';if(prev.length)h+='<div class="sec">⭐ מוצרים שהזמנתם בעבר</div>'+prev.map(row).join('');
 if(rest.length)h+='<div class="sec">'+(prev.length?'עוד מהקטלוג':'הקטלוג')+'</div>'+rest.slice(0,s?400:120).map(row).join('')+(!s&&rest.length>120?'<div class="msg" style="padding:14px">'+(rest.length-120)+' מוצרים נוספים — חפשו לפי שם או מק״ט</div>':'');
 if(!h)h='<div class="msg">לא נמצאו מוצרים</div>';
 $('main').innerHTML=h;bind();lazy();}
function bind(){var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length;i++)(function(c){var id=c.getAttribute('data-id');
 var a=c.querySelector('.add');if(a)a.onclick=function(){set(id,+a.getAttribute('data-add'));};
 var bs=c.querySelectorAll('.qty button');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){set(id,(qty[id]||0)+(+this.getAttribute('data-d')));};
 var inp=c.querySelector('.qty input');if(inp)inp.onchange=function(){set(id,parseInt(this.value,10)||0);};})(cs[i]);}
function set(id,v){v=Math.max(0,Math.min(9999,v|0));if(v)qty[id]=v;else delete qty[id];
 try{localStorage.setItem('jo_'+T,JSON.stringify({q:qty,ts:Date.now()}));}catch(e){}
 var c=document.querySelector('.card[data-id="'+id+'"]');if(c){var p=D.products.filter(function(x){return x.id===id;})[0];var tmp=document.createElement('div');tmp.innerHTML=row(p);c.parentNode.replaceChild(tmp.firstChild,c);bind();lazy();}sum();}
function sum(){var t=0,n=0;D.products.forEach(function(p){var q=qty[p.id];if(q){t+=q*p.price_agorot;n++;}});
 $('sum').textContent=ils(t);$('sumd').textContent=n+' פריטים · לפני מע״מ';$('go').disabled=!n;}
function lazy(){var need=[];var cs=document.querySelectorAll('.card');for(var i=0;i<cs.length&&need.length<40;i++){var k=cs[i].getAttribute('data-sku');if(!imgs[k]&&!asked[k]){asked[k]=1;need.push(k);}}
 if(!need.length)return;rpc('reorder_images',{p_token:T,p_skus:need}).then(function(r){(r||[]).forEach(function(x){imgs[x.sku]=x.data_url;var im=document.querySelector('.card[data-sku="'+CSS.escape(x.sku)+'"] .thumb');if(im)im.src=x.data_url;});if(need.length===40)lazy();},function(){});}
var tm;$('q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){if(D)draw();},180);});
$('go').onclick=function(){var items=[],t=0;D.products.forEach(function(p){var q=qty[p.id];if(q){items.push({p:p,q:q});t+=q*p.price_agorot;}});if(!items.length)return;
 var vat=Math.round(t*(+D.vat_pct||18)/100);
 var ov=document.createElement('div');ov.className='ovl';ov.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">סיכום ההזמנה</b><span id="x" style="font-size:26px;cursor:pointer;color:var(--mut)">×</span></div>'+
  '<div style="margin-top:8px">'+items.map(function(i){return '<div class="line"><span>'+esc(i.p.name)+'</span><b style="white-space:nowrap">× '+i.q+'</b></div>';}).join('')+'</div>'+
  '<div class="line"><span>לפני מע״מ</span><b>'+ils(t)+'</b></div><div class="line"><span>מע״מ</span><span>'+ils(vat)+'</span></div><div class="line" style="border:none"><b>סה״כ</b><b>'+ils(t+vat)+'</b></div>'+
  (t<MIN?'<div class="note">מינימום הזמנה '+ils(MIN)+' לפני מע״מ — הסוכנת תחזור אליכם אם צריך להשלים.</div>':'')+
  '<label style="display:block;margin-top:12px;font-size:13px;font-weight:700">שם המזמין/ה<input id="nm" class="field" autocomplete="name"></label>'+
  '<label style="display:block;margin-top:10px;font-size:13px;font-weight:700">הערה לסוכנת (לא חובה)<textarea id="nt" class="field" rows="3"></textarea></label>'+
  '<div style="font-size:12px;color:var(--mut);margin-top:10px;line-height:1.6">ההזמנה עוברת לאישור הסוכנת. המחירים הסופיים, הבונוסים וההנחות יאושרו על ידה.</div>'+
  '<button class="cta" id="send" style="width:100%;margin-top:12px">שליחה לאישור</button></div>';
 document.body.appendChild(ov);var close=function(){ov.remove();};$('x').onclick=close;ov.onclick=function(e){if(e.target===ov)close();};
 try{$('nm').value=localStorage.getItem('jo_name')||'';}catch(e){}
 $('send').onclick=function(){var b=this;b.disabled=true;b.textContent='שולח…';var nm=$('nm').value.trim();try{localStorage.setItem('jo_name',nm);}catch(e){}
  rpc('reorder_submit',{p_token:T,p_items:items.map(function(i){return {product_id:i.p.id,qty:i.q};}),p_note:$('nt').value,p_name:nm}).then(function(r){
   if(r&&r.ok){qty={};try{localStorage.removeItem('jo_'+T);}catch(e){}ov.remove();$('bar').hidden=true;window.scrollTo(0,0);
    $('main').innerHTML='<div class="msg"><div class="big">✅</div><b style="font-size:18px;color:var(--ink)">ההזמנה נשלחה!</b><br>'+(D.agent?D.agent+' ':'הסוכנת ')+'תאשר אותה ותעביר למשרד.<br>אפשר לשמור את הקישור הזה להזמנות הבאות.<br><br><button class="cta" id="again">הזמנה נוספת</button></div>';
    $('again').onclick=function(){$('bar').hidden=false;draw();sum();};}
   else{b.disabled=false;b.textContent='שליחה לאישור';alert(r&&r.error==='rate_limited'?'נשלחו כבר כמה הזמנות היום — הסוכנת תיצור קשר.':'השליחה נכשלה. נסו שוב.');}
  },function(){b.disabled=false;b.textContent='שליחה לאישור';alert('אין חיבור לאינטרנט. ההזמנה נשמרה במכשיר — נסו לשלוח שוב.');});};};
})();
</script>
</body>
</html>
