<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ליברטי — סוכני שטח</title>
<meta name="theme-color" content="#0f6b74">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f6b74'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>ל</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f7f5f2;--sur:#fff;--ink:#24211d;--mut:#857f76;--line:#e8e4dd;--acc:#0f6b74;--accd:#0a4f56;--accs:#e3eff0;--good:#2f7d46;--goods:#e5f2e8;--warn:#a86514;--warns:#f7ecd9;--bad:#b3372e;--bads:#f9e7e4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Heebo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
input,button{font-family:inherit}input{outline:none}
.card{background:var(--sur);border-radius:15px;padding:12px 14px}
.badge{font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px;display:inline-block}
.b-good{background:var(--goods);color:var(--good)}.b-warn{background:var(--warns);color:var(--warn)}
.b-bad{background:var(--bads);color:var(--bad)}.b-mut{background:#efece7;color:var(--mut)}.b-acc{background:var(--acc);color:#fff}
#nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
#nav button{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);font-weight:500;cursor:pointer}
#nav button.on{color:var(--acc);font-weight:700}
#nav svg{stroke:#a39b90}#nav button.on svg{stroke:var(--acc)}
#view{padding-bottom:80px;min-height:100dvh;max-width:520px;margin:0 auto}
.search{height:46px;background:#f2efe9;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 13px}
.search input{border:none;background:transparent;font-size:16px;font-weight:600;flex:1}
.hdr{background:#fff;padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.h1{font-size:19px;font-weight:800;margin-bottom:10px}
.list{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.stat{border-radius:12px;padding:10px 12px}
button.cta{height:52px;background:var(--acc);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://ooxdupeihzvbzudibaoi.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9veGR1cGVpaHp2Ynp1ZGliYW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTk2ODUsImV4cCI6MjA5MjUzNTY4NX0.-phHZwltk41dIJM6tal9B7t2WZVLrAXLV6is4djN9_A';
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var $=function(id){return document.getElementById(id)};
var ils=function(a){return a==null?'—':'₪'+(a/100).toLocaleString('he-IL',{maximumFractionDigits:2})};
var esc=function(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
var route='home';
var ICONS={home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',cat:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',cust:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',ord:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.5a2 2 0 0 0 2 1.5h7.9a2 2 0 0 0 2-1.6L21 8H6"/>',pay:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/>'};
var TABS=[['home','היום שלי','home'],['catalog','קטלוג','cat'],['customers','לקוחות','cust'],['orders','הזמנה','ord'],['collections','גבייה','pay']];
function nav(){var h='';for(var i=0;i<TABS.length;i++){var t=TABS[i];h+='<button data-r="'+t[0]+'" class="'+(route===t[0]?'on':'')+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[t[2]]+'</svg><span>'+t[1]+'</span></button>'}return '<nav id="nav">'+h+'</nav>'}
function shell(inner){$('app').innerHTML='<div id="view">'+inner+'</div>'+nav();var b=document.querySelectorAll('#nav button');for(var i=0;i<b.length;i++){b[i].onclick=function(){route=this.getAttribute('data-r');render()}}}
function loginView(){
 $('app').innerHTML='<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#0f6b74 0%,#0a4f56 42%,#f7f5f2 42.1%)"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:84px"><div style="width:72px;height:72px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(10,79,86,.35)"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0f6b74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/></svg></div><div style="color:#fff;font-size:26px;font-weight:800">ליברטי</div><div style="color:#bfe0e3;font-size:14px">מערכת סוכני שטח</div></div><div style="width:330px;max-width:88vw;background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(36,33,29,.1);padding:24px;margin-top:36px;display:flex;flex-direction:column;gap:16px"><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--mut)">קוד עובד</span><input id="code" inputmode="numeric" style="height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:20px;font-weight:700;letter-spacing:4px"></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--mut)">קוד אישי (PIN)</span><input id="pin" type="password" inputmode="numeric" style="height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:20px;font-weight:700;letter-spacing:6px"></label><div id="err" style="color:var(--bad);font-size:13px;font-weight:600"></div><button class="cta" id="go">כניסה</button></div><div style="margin-top:auto;margin-bottom:24px;font-size:12px;color:var(--mut)">שכחת קוד? פני למשרד</div></div>';
 var go=function(){var code=$('code').value.trim(),pin=$('pin').value.trim();if(!code||!pin)return;$('go').textContent='רק רגע…';sb.auth.signInWithPassword({email:'u'+code+'@liberty.app',password:pin}).then(function(r){if(r.error){$('err').textContent='קוד עובד או קוד אישי שגויים';$('go').textContent='כניסה'}else{route='home';render()}})};
 $('go').onclick=go;$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
}
function homeView(){
 shell('<div style="background:var(--acc);padding:18px 20px 44px"><div style="color:#bfe0e3;font-size:13px">'+new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'})+'</div><div id="hi" style="color:#fff;font-size:20px;font-weight:800">שלום…</div><button data-go="catalog" style="margin-top:14px;height:48px;width:100%;background:#fff;border:none;border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 4px 14px rgba(10,79,86,.25);cursor:pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span style="color:#a39b90;font-size:15px">חיפוש מוצר — שם או מק״ט…</span></button></div><div style="padding:0 16px;margin-top:-24px;display:flex;flex-direction:column;gap:12px"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><button class="card" data-go="customers" style="text-align:right;border:none;box-shadow:0 6px 18px rgba(36,33,29,.06);cursor:pointer;color:inherit"><div style="font-size:12px;color:var(--mut);font-weight:600">לקוחות פעילים</div><div id="s1" style="font-size:26px;font-weight:800;color:var(--acc)">…</div><div id="s2" style="font-size:12px;color:var(--mut)"></div></button><button class="card" data-go="collections" style="text-align:right;border:none;box-shadow:0 6px 18px rgba(36,33,29,.06);cursor:pointer;color:inherit"><div style="font-size:12px;color:var(--mut);font-weight:600">חוב פתוח</div><div id="s3" style="font-size:22px;font-weight:800;color:var(--bad)">…</div><div id="s4" style="font-size:12px;color:var(--mut)"></div></button></div><div style="background:var(--accs);border-radius:13px;padding:11px 14px;font-size:12.5px;color:var(--accd);line-height:1.5">גרסה חיה (פאזה 0) — מחוברת חי לבסיס הנתונים. הזמנות, מסלולים ויעדים בדרך.</div><div style="text-align:center"><a href="#" id="out" style="font-size:12px;color:var(--mut)">התנתקות</a></div></div>');
 var gb=document.querySelectorAll('[data-go]');for(var i=0;i<gb.length;i++){gb[i].onclick=function(){route=this.getAttribute('data-go');render()}}
 $('out').onclick=function(e){e.preventDefault();sb.auth.signOut().then(function(){route='home';render()})};
 sb.from('liberty_me').select('name').single().then(function(r){if(r.data)$('hi').textContent='שלום, '+r.data.name});
 sb.from('liberty_customers').select('lifecycle,debt_agorot').then(function(r){var d=r.data||[],act=0,pot=0,debt=0,dbt=0;for(var i=0;i<d.length;i++){if(d[i].lifecycle==='active')act++;if(d[i].lifecycle==='potential')pot++;if(d[i].debt_agorot>0){dbt++;debt+=d[i].debt_agorot}}if($('s1')){$('s1').textContent=act;$('s2').textContent='+ '+pot+' פוטנציאליים';$('s3').textContent=ils(debt);$('s4').textContent=dbt+' לקוחות'}});
}
var tmr=null;
function catalogView(){
 shell('<div class="hdr"><div class="h1">קטלוג</div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="שם מוצר או מק״ט…" autofocus></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 function run(){var q=$('q').value.trim();var query=sb.from('liberty_products').select('sku,name,brand,pack_size,is_commissionable,is_teaser,price_agorot,bonus_buy,bonus_get').order('sku').limit(60);if(q)query=query.or('name.ilike.%'+q+'%,sku.ilike.%'+q+'%,barcode.ilike.%'+q+'%');query.then(function(r){var d=r.data||[],h='';for(var i=0;i<d.length;i++){var p=d[i];var b='';if(p.is_teaser)b+='<span class="badge b-acc">בקרוב</span> ';if(p.bonus_buy!=null&&p.bonus_get>0)b+='<span class="badge b-warn">בונוס '+p.bonus_buy+'+'+p.bonus_get+'</span> ';if(p.is_commissionable===true)b+='<span class="badge b-good">מזכה בעמלה</span>';if(p.is_commissionable===false)b+='<span class="badge b-mut">ללא עמלה</span>';h+='<div class="card" style="display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><div style="font-size:11.5px;color:var(--mut);font-weight:700">'+esc(p.sku)+(p.brand?' · '+esc(p.brand):'')+(p.pack_size?' · אריזה '+p.pack_size:'')+'</div><div style="font-size:14.5px;font-weight:700;line-height:1.3">'+esc(p.name)+'</div><div style="margin-top:5px">'+b+'</div></div><div style="font-size:18px;font-weight:800;color:var(--acc);white-space:nowrap">'+ils(p.price_agorot)+'</div></div>'}$('res').innerHTML=h||'<div style="color:var(--mut);font-size:13px">לא נמצאו מוצרים</div>'})}
 $('q').addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(run,150)});run();
}
function customersView(){
 var LC={active:['פעיל','b-good'],potential:['פוטנציאלי','b-warn'],disqualified:['לא רלוונטי','b-mut']};
 shell('<div class="hdr"><div class="h1">לקוחות</div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="שם או עיר…"></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 function run(){var q=$('q').value.trim();var query=sb.from('liberty_customers').select('name,city,chain,lifecycle,potential_level,debt_agorot,area_code,notes').neq('lifecycle','disqualified').order('debt_agorot',{ascending:false}).limit(250);if(q)query=query.or('name.ilike.%'+q+'%,city.ilike.%'+q+'%');query.then(function(r){var d=r.data||[],h='';for(var i=0;i<d.length;i++){var c=d[i];var lc=LC[c.lifecycle]||LC.potential;h+='<div class="card cust" style="cursor:pointer"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700">'+esc(c.name)+'</div><div style="font-size:12px;color:var(--mut)">'+esc(c.city||'')+(c.area_code?' · אזור '+c.area_code:'')+(c.chain?' · '+esc(c.chain):'')+'</div></div><span class="badge '+lc[1]+'">'+lc[0]+(c.potential_level==='high'?' · גבוה':'')+'</span>'+(c.debt_agorot>0?'<span class="badge b-bad">'+ils(c.debt_agorot)+'</span>':'')+'</div><div class="more" style="display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);line-height:1.5">'+esc(c.notes||'אין הערות')+'</div></div>'}$('res').innerHTML=h;var cd=document.querySelectorAll('.cust');for(var j=0;j<cd.length;j++){cd[j].onclick=function(){var m=this.querySelector('.more');m.style.display=m.style.display==='none'?'block':'none'}}})}
 $('q').addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(run,150)});run();
}
function collectionsView(){
 shell('<div class="hdr"><div class="h1">גבייה · גיול אוגוסט</div><div id="tot" style="display:grid;grid-template-columns:repeat(2,1fr);gap:9px"></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 sb.from('liberty_customers').select('name,city,debt_agorot,oldest_invoice').gt('debt_agorot',0).order('debt_agorot',{ascending:false}).then(function(r){var d=r.data||[],total=0,o30=0,h='',now=Date.now();for(var i=0;i<d.length;i++){total+=d[i].debt_agorot;var days=d[i].oldest_invoice?Math.floor((now-new Date(d[i].oldest_invoice).getTime())/86400000):null;if(days!=null&&days>30)o30++;var sev=days==null?'var(--line)':days>60?'var(--bad)':days>30?'var(--warn)':'var(--good)';h+='<div class="card" style="border-inline-start:4px solid '+sev+';display:flex;align-items:center;gap:10px"><div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:800">'+esc(d[i].name)+'</div><div style="font-size:12px;color:var(--mut)">'+esc(d[i].city||'')+(days!=null?' · הוותיקה: לפני '+days+' יום':'')+'</div></div><div style="font-size:16px;font-weight:800;color:var(--bad);white-space:nowrap">'+ils(d[i].debt_agorot)+'</div></div>'}$('tot').innerHTML='<div class="stat" style="background:var(--bads)"><div style="font-size:11px;font-weight:700;color:var(--bad)">חוב כולל</div><div style="font-size:17px;font-weight:800">'+ils(total)+'</div></div><div class="stat" style="background:var(--warns)"><div style="font-size:11px;font-weight:700;color:var(--warn)">מעל 30 יום</div><div style="font-size:17px;font-weight:800">'+o30+' לקוחות</div></div>';$('res').innerHTML=h});
}
function ordersView(){shell('<div style="padding:16px"><div class="h1">הזמנה</div><div class="card" style="color:var(--mut);font-size:13.5px;line-height:1.6">זרימת ההזמנה — עגלה מהקטלוג + הזמנה מהירה במצב מק״ט — נבנית בפאזה 1. בינתיים: חיפוש מחיר בקטלוג תוך שניות</div></div>')}
function render(){sb.auth.getSession().then(function(r){if(!r.data.session){loginView();return}if(route==='catalog')catalogView();else if(route==='customers')customersView();else if(route==='collections')collectionsView();else if(route==='orders')ordersView();else homeView()})}
render();
</script>
</body>
</html>
