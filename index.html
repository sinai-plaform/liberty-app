<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f7f5f2;--sur:#fff;--ink:#24211d;--mut:#857f76;--line:#e8e4dd;--acc:#0f6b74;--accd:#0a4f56;--accs:#e3eff0;--good:#2f7d46;--goods:#e5f2e8;--warn:#a86514;--warns:#f7ecd9;--bad:#b3372e;--bads:#f9e7e4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Heebo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
input,button,select,textarea{font-family:inherit}input,textarea{outline:none}
.card{background:var(--sur);border-radius:15px;padding:12px 14px}
.badge{font-size:11px;font-weight:700;border-radius:7px;padding:3px 8px;display:inline-block}
.b-good{background:var(--goods);color:var(--good)}.b-warn{background:var(--warns);color:var(--warn)}
.b-bad{background:var(--bads);color:var(--bad)}.b-mut{background:#efece7;color:var(--mut)}.b-acc{background:var(--acc);color:#fff}
#nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:20}
#nav button{background:none;border:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);font-weight:500;cursor:pointer}
#nav button.on{color:var(--acc);font-weight:700}
#nav svg{stroke:#a39b90}#nav button.on svg{stroke:var(--acc)}
#view{padding-bottom:80px;min-height:100dvh;max-width:520px;margin:0 auto}
.search{height:46px;background:#f2efe9;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 13px}
.search input{border:none;background:transparent;font-size:16px;font-weight:600;flex:1}
.hdr{background:#fff;padding:16px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.h1{font-size:19px;font-weight:800;margin-bottom:10px}
.list{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.stat{border-radius:12px;padding:10px 12px}
button.cta{height:52px;background:var(--acc);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
button.cta:disabled{opacity:.45}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#f2efe9;flex:none}
.thumbph{width:48px;height:48px;border-radius:10px;background:#f2efe9;flex:none;display:flex;align-items:center;justify-content:center}
.step{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:32px;height:32px;border:none;background:#f7f5f2;font-size:18px;font-weight:800;color:var(--acc);cursor:pointer}
.step span{min-width:34px;text-align:center;font-weight:800;font-size:15px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#24211d;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.field{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;font-size:15px;font-weight:600;background:#fff}
textarea.field{height:auto;min-height:80px;padding:11px 13px;resize:vertical}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:var(--acc)}
.ovl{position:fixed;inset:0;background:rgba(36,33,29,.4);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#fff;border-radius:20px 20px 0 0;max-width:520px;margin:0 auto;width:100%;max-height:82vh;display:flex;flex-direction:column}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>

<script>
var SB_URL='https://ooxdupeihzvbzudibaoi.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9veGR1cGVpaHp2Ynp1ZGliYW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5NTk2ODUsImV4cCI6MjA5MjUzNTY4NX0.-phHZwltk41dIJM6tal9B7t2WZVLrAXLV6is4djN9_A';
var sb=window.supabase.createClient(SB_URL,SB_KEY);

var cart={cust:null,items:[]};

var TABS=[['home','היום שלי','home'],['catalog','קטלוג','cat'],['customers','לקוחות','cust'],['orders','הזמנה','ord'],['collections','גבייה','pay']];
function nav(){var h='';for(var i=0;i<TABS.length;i++){var t=TABS[i];h+='<button data-r="'+t[0]+'" class="'+(route===t[0]?'on':'')+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICONS[t[2]]+'</svg><span>'+t[1]+'</span></button>'}return '<nav id="nav">'+h+'</nav>'}
function shell(inner){$('app').innerHTML='<div id="view">'+inner+'</div>'+nav();var b=document.querySelectorAll('#nav button');for(var i=0;i<b.length;i++){b[i].onclick=function(){route=this.getAttribute('data-r');render()}}}
function bindGo(){var gb=document.querySelectorAll('[data-go]');for(var i=0;i<gb.length;i++){gb[i].onclick=function(){route=this.getAttribute('data-go');render()}}}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function thumb(sku){var u=imgMap[sku];if(u)return '<img class="thumb" src="'+u+'" onerror="this.style.visibility=\'hidden\'">';return '<div class="thumbph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c3bcb0" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="9" cy="9" r="1.4"/></svg></div>'}

function loginView(){
 $('app').innerHTML='<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#0f6b74 0%,#0a4f56 42%,#f7f5f2 42.1%)"><div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:84px"><div style="width:72px;height:72px;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(10,79,86,.35)"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#0f6b74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/></svg></div><div style="color:#fff;font-size:26px;font-weight:800">ליברטי</div><div style="color:#bfe0e3;font-size:14px">מערכת סוכני שטח</div></div><div style="width:330px;max-width:88vw;background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(36,33,29,.1);padding:24px;margin-top:36px;display:flex;flex-direction:column;gap:16px"><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--mut)">קוד עובד</span><input id="code" inputmode="numeric" style="height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:20px;font-weight:700;letter-spacing:4px"></label><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:600;color:var(--mut)">קוד אישי (PIN)</span><input id="pin" type="password" inputmode="numeric" style="height:52px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:20px;font-weight:700;letter-spacing:6px"></label><div id="err" style="color:var(--bad);font-size:13px;font-weight:600"></div><button class="cta" id="go">כניסה</button></div><div style="margin-top:auto;margin-bottom:24px;font-size:12px;color:var(--mut)">שכחת קוד? פני למשרד</div></div>';
 var go=function(){var code=$('code').value.trim(),pin=$('pin').value.trim();if(!code||!pin)return;$('go').textContent='רק רגע…';sb.auth.signInWithPassword({email:'u'+code+'@liberty.app',password:pin}).then(function(r){if(r.error){$('err').textContent='קוד עובד או קוד אישי שגויים';$('go').textContent='כניסה'}else{boot()}})};
 $('go').onclick=go;$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')go()});
}

function boot(){
 // load me + image map, then render
 sb.from('liberty_me').select('id,name,role').single().then(function(r){me=r.data;});
 sb.from('liberty_product_images').select('sku,data_url').then(function(r){imgMap={};(r.data||[]).forEach(function(x){imgMap[x.sku]=x.data_url});route='home';render()});
}

function homeView(){
 shell('<div style="background:var(--acc);padding:18px 20px 44px"><div style="color:#bfe0e3;font-size:13px">'+new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric'})+'</div><div id="hi" style="color:#fff;font-size:20px;font-weight:800">שלום'+(me?', '+esc(me.name):'…')+'</div><button data-go="catalog" style="margin-top:14px;height:48px;width:100%;background:#fff;border:none;border-radius:13px;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 4px 14px rgba(10,79,86,.25);cursor:pointer"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span style="color:#a39b90;font-size:15px">חיפוש מוצר — שם או מק״ט…</span></button></div><div style="padding:0 16px;margin-top:-24px;display:flex;flex-direction:column;gap:12px"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><button class="card" data-go="customers" style="text-align:right;border:none;box-shadow:0 6px 18px rgba(36,33,29,.06);cursor:pointer;color:inherit"><div style="font-size:12px;color:var(--mut);font-weight:600">לקוחות פעילים</div><div id="s1" style="font-size:26px;font-weight:800;color:var(--acc)">…</div><div id="s2" style="font-size:12px;color:var(--mut)"></div></button><button class="card" data-go="collections" style="text-align:right;border:none;box-shadow:0 6px 18px rgba(36,33,29,.06);cursor:pointer;color:inherit"><div style="font-size:12px;color:var(--mut);font-weight:600">חוב פתוח</div><div id="s3" style="font-size:22px;font-weight:800;color:var(--bad)">…</div><div id="s4" style="font-size:12px;color:var(--mut)"></div></button></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><button class="card qa" data-go="route" style="border:none;cursor:pointer;color:inherit;text-align:center;padding:14px 6px"><div style="font-size:22px">🚚</div><div style="font-size:12.5px;font-weight:700;margin-top:4px">מסלול היום</div></button><button class="card qa" data-go="visits" style="border:none;cursor:pointer;color:inherit;text-align:center;padding:14px 6px"><div style="font-size:22px">📍</div><div style="font-size:12.5px;font-weight:700;margin-top:4px">ביקורים</div></button><button class="card qa" data-go="targets" style="border:none;cursor:pointer;color:inherit;text-align:center;padding:14px 6px"><div style="font-size:22px">🎯</div><div style="font-size:12.5px;font-weight:700;margin-top:4px">יעדים</div></button></div><div style="background:var(--accs);border-radius:13px;padding:11px 14px;font-size:12.5px;color:var(--accd);line-height:1.5">גרסה חיה — מחוברת חי לבסיס הנתונים. בונה הזמנות, מסלול, ביקורים ויעדים.</div><div style="text-align:center"><a href="#" id="out" style="font-size:12px;color:var(--mut)">התנתקות</a></div></div>');
 bindGo();
 $('out').onclick=function(e){e.preventDefault();sb.auth.signOut().then(function(){me=null;route='home';render()})};
 sb.from('liberty_customers').select('lifecycle,debt_agorot').then(function(r){var d=r.data||[],act=0,pot=0,debt=0,dbt=0;for(var i=0;i<d.length;i++){if(d[i].lifecycle==='active')act++;if(d[i].lifecycle==='potential')pot++;if(d[i].debt_agorot>0){dbt++;debt+=d[i].debt_agorot}}if($('s1')){$('s1').textContent=act;$('s2').textContent='+ '+pot+' פוטנציאליים';$('s3').textContent=ils(debt);$('s4').textContent=dbt+' לקוחות'}});
}

var tmr=null;
function catalogView(){
 shell('<div class="hdr"><div class="h1">קטלוג</div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="שם מוצר או מק״ט…" autofocus></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 function run(){var q=$('q').value.trim();var query=sb.from('liberty_products').select('sku,name,brand,pack_size,is_commissionable,is_teaser,price_agorot,bonus_buy,bonus_get').order('sku').limit(80);if(q)query=query.or('name.ilike.%'+q+'%,sku.ilike.%'+q+'%,barcode.ilike.%'+q+'%');query.then(function(r){var d=r.data||[],h='';for(var i=0;i<d.length;i++){var p=d[i];var b='';if(p.is_teaser)b+='<span class="badge b-acc">בקרוב</span> ';if(p.bonus_buy!=null&&p.bonus_get>0)b+='<span class="badge b-warn">בונוס '+p.bonus_buy+'+'+p.bonus_get+'</span> ';if(p.is_commissionable===true)b+='<span class="badge b-good">מזכה בעמלה</span>';if(p.is_commissionable===false)b+='<span class="badge b-mut">ללא עמלה</span>';h+='<div class="card" style="display:flex;align-items:center;gap:11px">'+thumb(p.sku)+'<div style="flex:1;min-width:0"><div style="font-size:11.5px;color:var(--mut);font-weight:700">'+esc(p.sku)+(p.brand?' · '+esc(p.brand):'')+(p.pack_size?' · אריזה '+p.pack_size:'')+'</div><div style="font-size:14px;font-weight:700;line-height:1.3">'+esc(p.name)+'</div><div style="margin-top:5px">'+b+'</div></div><div style="text-align:left"><div style="font-size:17px;font-weight:800;color:var(--acc);white-space:nowrap">'+ils(p.price_agorot)+'</div><button class="addp" data-sku="'+esc(p.sku)+'" style="margin-top:6px;border:none;background:var(--accs);color:var(--accd);font-weight:800;font-size:13px;border-radius:9px;padding:5px 12px;cursor:pointer">+ הזמנה</button></div></div>'}$('res').innerHTML=h||'<div style="color:var(--mut);font-size:13px">לא נמצאו מוצרים</div>';var ap=document.querySelectorAll('.addp');for(var j=0;j<ap.length;j++){ap[j].onclick=function(){addToCartBySku(this.getAttribute('data-sku'))}}})}
 $('q').addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(run,150)});run();
}

function addToCartBySku(sku){
 sb.from('liberty_products').select('id,sku,name,price_agorot,is_commissionable,bonus_buy,bonus_get').eq('sku',sku).single().then(function(r){var p=r.data;if(!p)return;var ex=null;for(var i=0;i<cart.items.length;i++){if(cart.items[i].id===p.id)ex=cart.items[i]}if(ex){ex.qty++}else{cart.items.push({id:p.id,sku:p.sku,name:p.name,price:p.price_agorot||0,comm:p.is_commissionable===true,bonus_buy:p.bonus_buy,bonus_get:p.bonus_get,qty:1})}toast('נוסף להזמנה: '+p.name);route='orders';render()});
}

// ---------- customers ----------
function customersView(){
 var LC={active:['פעיל','b-good'],potential:['פוטנציאלי','b-warn'],disqualified:['לא רלוונטי','b-mut']};
 shell('<div class="hdr"><div class="h1">לקוחות</div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="שם או עיר…"></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 function run(){var q=$('q').value.trim();var query=sb.from('liberty_customers').select('id,name,city,chain,lifecycle,potential_level,debt_agorot,area_code,area_name,notes,address').neq('lifecycle','disqualified').order('debt_agorot',{ascending:false}).limit(300);if(q)query=query.or('name.ilike.%'+q+'%,city.ilike.%'+q+'%');query.then(function(r){var d=r.data||[],h='';for(var i=0;i<d.length;i++){var c=d[i];var lc=LC[c.lifecycle]||LC.potential;h+='<div class="card cust" style="cursor:pointer"><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;min-width:0"><div style="font-size:14.5px;font-weight:700">'+esc(c.name)+'</div><div style="font-size:12px;color:var(--mut)">'+esc(c.city||'')+(c.area_code?' · אזור '+c.area_code:'')+(c.chain?' · '+esc(c.chain):'')+'</div></div><span class="badge '+lc[1]+'">'+lc[0]+(c.potential_level==='high'?' · גבוה':'')+'</span>'+(c.debt_agorot>0?'<span class="badge b-bad">'+ils(c.debt_agorot)+'</span>':'')+'</div><div class="more" style="display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:#6b655c;line-height:1.5">'+(c.address?'<div>📍 '+esc(c.address)+'</div>':'')+'<div style="margin-top:4px">'+esc(c.notes||'אין הערות')+'</div><div style="margin-top:8px;display:flex;gap:8px"><button class="mkord" data-id="'+c.id+'" data-name="'+esc(c.name)+'" style="border:none;background:var(--accs);color:var(--accd);font-weight:800;font-size:12.5px;border-radius:9px;padding:6px 12px;cursor:pointer">הזמנה חדשה</button><button class="mkvis" data-id="'+c.id+'" data-name="'+esc(c.name)+'" style="border:none;background:#efece7;color:var(--ink);font-weight:800;font-size:12.5px;border-radius:9px;padding:6px 12px;cursor:pointer">רישום ביקור</button></div></div></div>'}$('res').innerHTML=h;var cd=document.querySelectorAll('.cust');for(var j=0;j<cd.length;j++){cd[j].onclick=function(e){if(e.target.closest('button'))return;var m=this.querySelector('.more');m.style.display=m.style.display==='none'?'block':'none'}}
 var mo=document.querySelectorAll('.mkord');for(var k=0;k<mo.length;k++){mo[k].onclick=function(){cart.cust={id:this.getAttribute('data-id'),name:this.getAttribute('data-name')};route='orders';render()}}
 var mv=document.querySelectorAll('.mkvis');for(var k2=0;k2<mv.length;k2++){mv[k2].onclick=function(){visitTarget={id:this.getAttribute('data-id'),name:this.getAttribute('data-name')};route='visits';render()}}})}
 $('q').addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(run,150)});run();
}

  var target=tg?tg.target_agorot:0;var pct=tg?tg.commission_pct:0;
  var prog=target>0?Math.min(100,Math.round(achieved/target*100)):0;
  var commission=Math.round(achieved*pct/100);
  var remain=Math.max(0,target-achieved);
  var h='<div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">יעד חודשי (מוצרי בית)</div><div style="font-size:15px;font-weight:800;margin:2px 0 10px">'+ils(achieved)+' <span style="color:var(--mut);font-weight:600">מתוך '+ils(target)+'</span></div><div class="bar"><div style="width:'+prog+'%"></div></div><div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12px"><b style="color:var(--acc)">'+prog+'%</b><span style="color:var(--mut)">נותרו '+ils(remain)+'</span></div></div>'+
   '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">עמלה צפויה</div><div style="font-size:22px;font-weight:800;color:var(--good)">'+ils(commission)+'</div><div style="font-size:11px;color:var(--mut)">'+pct+'% ממוצרי הבית</div></div><div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">סה״כ מכירות החודש</div><div style="font-size:22px;font-weight:800;color:var(--acc)">'+ils(sales)+'</div><div style="font-size:11px;color:var(--mut)">'+orders.length+' הזמנות</div></div></div>'+
   '<div class="card" style="background:var(--accs);font-size:12.5px;color:var(--accd);line-height:1.5">העמלה מחושבת ממוצרי הבית בלבד (פראש גאם, MO, ווטס וכו׳) — לא מוצרי שוורץ/דורקס. היעד ניתן לעדכון ע״י המשרד.</div>';
  $('res').innerHTML=h;
 });
}

function render(){sb.auth.getSession().then(function(r){if(!r.data.session){loginView();return}if(!me){boot();return}
 if(route==='catalog')catalogView();
 else if(route==='customers')customersView();
 else if(route==='collections')collectionsView();
 else if(route==='orders')ordersView();
 else if(route==='myorders')myOrdersView();
 else if(route==='route')routeView();
 else if(route==='visits')visitsView();
 else if(route==='targets')targetsView();
 else homeView();
})}
render();
</script>
