/* ---- IndexedDB ---- */
var _db=null,_dbq=null;
function idb(cb){
 if(_db!==null){cb(_db||null);return}
 if(_dbq){_dbq.push(cb);return}
 _dbq=[cb];
 var done=function(db){_db=db||false;var q=_dbq;_dbq=null;for(var i=0;i<q.length;i++)q[i](db||null)};
 try{
  var rq=indexedDB.open('liberty',1);
  rq.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');if(!db.objectStoreNames.contains('outbox'))db.createObjectStore('outbox',{keyPath:'id'})};
  rq.onsuccess=function(){done(rq.result)};
  rq.onerror=function(){done(null)};
  rq.onblocked=function(){done(null)};
 }catch(e){done(null)}
}
function kvGet(k,cb){idb(function(db){if(!db){cb(null);return}try{var r=db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=function(){cb(r.result===undefined?null:r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}})}

function obPut(rec,cb){idb(function(db){if(!db){if(cb)cb(false);return}try{var t=db.transaction('outbox','readwrite');t.objectStore('outbox').put(rec);t.oncomplete=function(){if(cb)cb(true)};t.onerror=function(){if(cb)cb(false)};t.onabort=function(){if(cb)cb(false)}}catch(e){if(cb)cb(false)}})}
function obDel(id,cb){OFF.q=(OFF.q||[]).filter(function(o){return o.id!==id});idb(function(db){if(!db){if(cb)cb();return}try{var t=db.transaction('outbox','readwrite');t.objectStore('outbox').delete(id);t.oncomplete=function(){if(cb)cb()};t.onerror=function(){if(cb)cb()}}catch(e){if(cb)cb()}})}

/* ---- cached query: serves cache instantly, refreshes from network ---- */
function SQ(builder,key,cb,opt){
 opt=opt||{};var served=false,netdone=false;
 var give=function(d,cached,err){served=true;cb({data:d,cached:cached,error:err||null})};
 if(key)kvGet('q:'+key,function(v){if(served||netdone||v==null)return;give(opt.filter?v.filter(opt.filter):v,true)});
 var fail=function(err){netdone=true;netMark(false,err);
  if(served)return;
  if(key){kvGet('q:'+key,function(v){if(served)return;give(v==null?(opt.one?null:[]):(opt.filter?v.filter(opt.filter):v),true,err)})}
  else give(opt.one?null:[],false,err)};
 try{
  builder.then(function(r){
   if(r&&r.error){fail(r.error);return}
   netdone=true;netMark(true);
   var d=r?r.data:null;if(!opt.one&&!d)d=[];
   if(key&&!opt.filter&&d!=null)kvPut('q:'+key,d);
   give(d,false);
  },function(e){fail(e)});
 }catch(e){fail(e)}
}

var LOC={products:[],customers:[],phones:[],areas:[]};
var _locRefreshing=false;
function locLoad(cb){
 var keys=['products','customers','phones','areas'],n=0;
 var done=function(){if(++n===keys.length&&cb)cb()};
 keys.forEach(function(k){kvGet('snap:'+k,function(v){if(v&&v.length)LOC[k]=v;done()})});
}
function locRefresh(cb){
 if(_locRefreshing){if(cb)cb(false);return}
 _locRefreshing=true;
 var jobs=[
  ['products',sb.from('liberty_products').select('*').limit(1000)],
  ['customers',sb.from('liberty_customers').select('*').limit(1000)],
  ['phones',sb.from('liberty_customer_phones').select('*').limit(2000)],
  ['areas',sb.from('areas').select('id,code,name').order('code')]
 ];
 var i=0,changed=false;
 var next=function(){
  if(i>=jobs.length){_locRefreshing=false;if(changed){OFF.lastSync=Date.now();kvPut('snap:ts',OFF.lastSync)}updateSync();if(cb)cb(changed);return}
  var j=jobs[i++];
  j[1].then(function(r){
   if(r&&!r.error&&r.data&&r.data.length){netMark(true);LOC[j[0]]=r.data;changed=true;kvPut('snap:'+j[0],r.data)}
   else if(r&&r.error)netMark(false,r.error);
   next();
  },function(e){netMark(false,e);next()});
 };
 next();
}

function upFiles(op,bucket,cb){
 var fs=op.files||[];if(!fs.length){cb([]);return}
 var urls=[],i=0,err=null;
 var next=function(){
  if(i>=fs.length){cb(err?null:urls,err);return}
  var f=fs[i];var idx=i;i++;
  var ext=((f.name||'photo.jpg').split('.').pop()||'jpg').toLowerCase();
  var path=(op.payload&&op.payload.dir?op.payload.dir:'misc')+'/'+op.id+'_'+idx+'.'+ext;
  sb.storage.from(bucket).upload(path,f,{contentType:f.type||'image/jpeg',upsert:true}).then(function(u){
   if(u&&u.error&&isNetErr(u.error)){err=u.error;cb(null,err);return}
   if(!u||!u.error){var pu=sb.storage.from(bucket).getPublicUrl(path);if(pu&&pu.data)urls.push(pu.data.publicUrl)}
   next();
  },function(e){err=e;cb(null,err)});
 };
 next();
}
function isDupErr(e){return !!(e&&(e.code==='23505'||(''+(e.message||'')).indexOf('duplicate key')>-1))}
function sendOp(op,cb){
 var p=op.payload||{};
 var fin=function(r){if(r&&r.error){if(isDupErr(r.error))cb(true);else cb(false,r.error)}else cb(true)};
 var boom=function(e){cb(false,e)};
 if(op.kind==='visit'){sb.from('visits').insert(p.row).then(fin,boom);return}
 if(op.kind==='route'){sb.from('daily_routes').upsert(p.row,{onConflict:'agent_id,route_date'}).then(fin,boom);return}
 if(op.kind==='payment'){
  upFiles(op,'payment-photos',function(urls,err){
   if(err){cb(false,err);return}
   var row=p.row;row.photos=(urls&&urls.length)?urls:(row.photos||[]);
   sb.from('payments').insert(row).then(fin,boom);
  });return}
 if(op.kind==='ret'){
  upFiles(op,'return-photos',function(urls,err){
   if(err){cb(false,err);return}
   var row=p.row;row.photos=(urls&&urls.length)?urls:(row.photos||[]);
   sb.from('returns').insert(row).then(fin,boom);
  });return}
 if(op.kind==='order'||op.kind==='order_update'){
  var oid=p.order.id;
  var items=function(){
   sb.from('order_items').delete().eq('order_id',oid).then(function(){
    sb.from('order_items').insert(p.items).then(fin,boom);
   },boom);
  };
  var writeOrder=function(){
   if(op.kind==='order_update'){
    var patch={};for(var k in p.order){if(k!=='id')patch[k]=p.order[k]}
    sb.from('orders').update(patch).eq('id',oid).then(function(r){if(r&&r.error){cb(false,r.error);return}items()},boom);
   }else{
    sb.from('orders').insert(p.order).then(function(r){if(r&&r.error&&!isDupErr(r.error)){cb(false,r.error);return}items()},boom);
   }
  };
  if((op.files||[]).length){
   upFiles(op,'payment-photos',function(urls,err){if(err){cb(false,err);return}if(urls&&urls.length)p.order.payment_photo=urls[0];writeOrder();});
  }else writeOrder();
  return}
 cb(false,{message:'סוג פעולה לא מוכר'});
}
function obFlush(cb){
 if(OFF.syncing){if(cb)cb();return}
 if(navigator.onLine===false){obCount();if(cb)cb();return}
 OFF.syncing=true;
 obAll(function(list){
  if(!list.length){OFF.syncing=false;OFF.pending=0;updateSync();if(cb)cb();return}
  OFF.pending=list.length;updateSync();
  var i=0,sent=0;
  var done=function(){OFF.syncing=false;obCount(function(){if(sent){if(typeof render==='function'&&(route==='myorders'||route==='visits'||route==='outbox'||route==='customer'))render();locRefresh()}});if(cb)cb()};
  var next=function(){
   if(i>=list.length){done();return}
   var op=list[i++];
   sendOp(op,function(ok,err){
    if(ok){sent++;obDel(op.id,function(){OFF.pending=Math.max(0,OFF.pending-1);updateSync();next()});return}
    op.tries=(op.tries||0)+1;op.err=(err&&(err.message||err.msg))||'שגיאה';op.net=isNetErr(err);
    obPut(op,function(){if(isNetErr(err)){netMark(false,err);done()}else{next()}});
   });
  };
  next();
 });
}

// ---- Auto-update: detect a newer deploy and refresh (safely) ----
var _updSeen=null,_updBusy=false;
function _safeReload(){
 if(document.querySelector('.ovl'))return false;                       // a sheet/overlay is open
 var a=document.activeElement,tn=a?a.tagName:'';
 if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT')return false;         // mid typing
 if(typeof cart!=='undefined'&&cart&&cart.items&&cart.items.length)return false; // order in progress
 return true;
}
function _doReload(){location.replace(location.pathname+'?v='+_updSeen);}
function _applyUpd(){ if(_safeReload())_doReload(); else _showUpdBanner(); }
function _showUpdBanner(){
 if(document.getElementById('updbar'))return;
 var b=document.createElement('div');b.id='updbar';
 b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:60;background:var(--acc);color:#fff;border-radius:13px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(10,79,86,.35);font-weight:700;font-size:13.5px';
 b.innerHTML='<span style="flex:1">גרסה חדשה זמינה</span><button id="updgo" style="background:#fff;color:var(--acc);border:none;border-radius:9px;padding:7px 15px;font-weight:700;font-size:13px;cursor:pointer">רענון</button>';
 document.body.appendChild(b);
 document.getElementById('updgo').onclick=_doReload;
}
function checkUpdate(){
 if(_updBusy)return;_updBusy=true;
 fetch('index.html?vc='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
  _updBusy=false;var m=t.match(/APP_VERSION='([^']+)'/);
  if(m&&m[1]&&m[1]!==APP_VERSION){_updSeen=m[1];_applyUpd();}
 }).catch(function(){_updBusy=false;});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(_updSeen)_applyUpd();else checkUpdate();}});

    var ins={sku:newSku,name:name,category:$('pe_cat').value,description:fields.description,pack_size:fields.pack_size,in_catalog:$('pe_incat').checked,in_stock:$('pe_stock').checked,is_active:true};
    var doIns=function(){sb.from('liberty_products_edit').insert(ins).select('id').single().then(function(r0){if(r0&&r0.error){toast('שגיאה בהוספה: '+r0.error.message);btn.disabled=false;btn.textContent='הוספת מוצר';return;}savePriceAndImg(r0.data.id,false);},function(){toast('שגיאה בהוספה');btn.disabled=false;btn.textContent='הוספת מוצר';});};
    // a SKU is UNIQUE across all products (incl. hidden/removed) — never create a duplicate; offer to edit the existing one
    sb.from('liberty_products_edit').select('id,name,is_active').eq('sku',newSku).maybeSingle().then(function(ex){
     if(ex&&ex.data&&ex.data.id){btn.disabled=false;btn.textContent='הוספת מוצר';toast('מק״ט '+newSku+' כבר קיים — ערכי את המוצר הקיים');showDup(ex.data.name,ex.data.is_active);var w=$('pe_dupwarn');if(w)w.scrollIntoView({behavior:'smooth',block:'center'});}
     else{doIns();}
    },function(){doIns();});
   }else{
    sb.from('liberty_products_edit').update(fields).eq('id',d.id).then(function(r1){
     if(r1.error){toast('שגיאה: '+r1.error.message);btn.disabled=false;btn.textContent='שמירת שינויים';return;}
     savePriceAndImg(d.id,true);
    });
   }
  };
 };
 if(isNew){build({sku:'',name:'',description:'',category:'pharmacy',pack_size:'',in_catalog:true});}
 else{sb.from('liberty_products_edit').select('id,sku,name,description,category,pack_size,bonus_group,in_catalog,in_stock').eq('id',p.id).single().then(function(r){build(r.data||p);});}
}
// ---- Automatic catalog import (in-browser: pdf.js → detect codes → group → upload slides → create) ----
function _safeSku(s){return String(s).replace(/[^A-Za-z0-9]+/g,'_');}
function _dataURLtoBlob(u){var a=u.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]),n=b.length,arr=new Uint8Array(n);while(n--)arr[n]=b.charCodeAt(n);return new Blob([arr],{type:m});}
function loadPdfJs(){if(window.__pdfjsP)return window.__pdfjsP;window.__pdfjsP=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.min.mjs').then(function(m){try{m.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.mjs';}catch(e){}return m;});return window.__pdfjsP;}
function _detectCodes(t){var re=/(?:^|[^A-Za-z])([A-Z]{2,6})\s*-\s*(\d{2,4})(\/\d+)?(?![0-9])/g,m,out=[],seen={};while(m=re.exec(t||'')){var code=m[1]+'-'+m[2]+(m[3]||'');if(!seen[code]){seen[code]=1;out.push(code);}}return out;}
function _barcode(t){var all=((t||'').match(/\d{8,14}/g)||[]);var pref=all.filter(function(x){return x.length>=12&&x.length<=13;});if(pref.length)return pref[0];return (all.sort(function(a,b){return b.length-a.length;})[0]||'');}
function _guessName(items,code){var best='';(items||[]).forEach(function(s){if(/[\u0590-\u05FF]/.test(s)&&s.indexOf(code)<0&&s.replace(/\s/g,'').length>best.replace(/\s/g,'').length)best=s;});return best.trim();}
function catalogImport(){
 if(!isMgr())return;
 var ov=document.createElement('div');ov.className='ovl';
 ov.innerHTML='<div class="sheet" style="max-height:94vh"><div style="padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">ייבוא קטלוג אוטומטי</b><span id="cix" style="font-size:24px;cursor:pointer;color:var(--mut)">×</span></div><div class="list" id="cibody" style="overflow:auto"></div></div>';
 document.body.appendChild(ov);ov.onclick=function(e){if(e.target===ov)ov.remove();};$('cix').onclick=function(){ov.remove();};
 var pages=null,products=null;
 function groupProducts(pgs){var prods=[],byCode={},last=[];pgs.forEach(function(pg){var codes=_detectCodes(pg.text||'');if(codes.length){var here=[];codes.forEach(function(code){var prod=byCode[code];if(!prod){prod={sku:code,slides:[],barcode:_barcode(pg.text),name:_guessName(pg.items,code),price:'',include:true};byCode[code]=prod;prods.push(prod);}if(prod.slides.indexOf(pg.idx)<0)prod.slides.push(pg.idx);here.push(prod);});last=here;}else{last.forEach(function(prod){if(prod.slides.indexOf(pg.idx)<0)prod.slides.push(pg.idx);});}});return prods;}
 function screenPick(){
  $('cibody').innerHTML='<div class="card" style="background:var(--accs);font-size:12px;color:var(--accd);line-height:1.7">בחרי קובץ קטלוג <b>PDF</b>. המערכת תפצל לעמודים, תזהה קודי מוצר (עמוד עם קוד חדש = מוצר חדש; עמוד ללא קוד = שייך למוצר מהעמוד הקודם), תצרף את השקפים המלאים ותקרא ברקוד/שם — ואז תוכלי לבדוק ולאשר.</div><div class="card"><input id="ci_file" type="file" accept="application/pdf" style="font-size:12px;width:100%"></div><button class="cta" id="ci_go" disabled>עיבוד הקטלוג</button><div id="ci_prog" style="text-align:center;color:var(--mut);font-size:12.5px;margin-top:10px"></div>';
  var f=null;$('ci_file').onchange=function(){f=this.files&&this.files[0];$('ci_go').disabled=!f;};
  $('ci_go').onclick=function(){if(!f)return;this.disabled=true;$('ci_prog').textContent='טוען מנוע PDF…';
   loadPdfJs().then(function(lib){return f.arrayBuffer().then(function(buf){return lib.getDocument({data:new Uint8Array(buf)}).promise;});}).then(function(pdf){
    var acc=[],i=1;
    function nextPage(){
     if(i>pdf.numPages){pages=acc;products=groupProducts(acc);screenReview();return;}
     $('ci_prog').textContent='מעבד עמוד '+i+' מתוך '+pdf.numPages+'…';
     pdf.getPage(i).then(function(page){
      var vp=page.getViewport({scale:1.35}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;var ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
      page.render({canvasContext:ctx,viewport:vp}).promise.then(function(){
       var dataUrl=c.toDataURL('image/jpeg',0.8);
       page.getTextContent().then(function(tc){
        var items=tc.items.map(function(it){return it.str;}).filter(function(s){return s&&s.trim();});
        acc.push({idx:i,dataUrl:dataUrl,items:items,text:items.join(' '),codeText:items.join('')});c.width=c.height=0;i++;nextPage();
       },function(){acc.push({idx:i,dataUrl:dataUrl,items:[],text:''});c.width=c.height=0;i++;nextPage();});
      },function(){acc.push({idx:i,dataUrl:dataUrl,items:[],text:''});c.width=c.height=0;i++;nextPage();});
     },function(){$('ci_prog').textContent='דילוג על עמוד '+i;i++;nextPage();});
    }
    nextPage();
   }).catch(function(e){$('ci_prog').innerHTML='<span style="color:var(--bad)">שגיאה בטעינת מנוע ה-PDF (נדרש אינטרנט). '+esc(''+(e&&e.message||e))+'</span>';var b=document.getElementById('ci_go');if(b)b.disabled=false;});
  };
 }
 function fieldVal(cls,ix){var el=document.querySelector('.'+cls+'[data-ix="'+ix+'"]');return el?el.value.trim():'';}
 function fieldChk(cls,ix){var el=document.querySelector('.'+cls+'[data-ix="'+ix+'"]');return el?el.checked:false;}
 function screenReview(){
  if(!products||!products.length){$('cibody').innerHTML='<div class="card" style="text-align:center;color:var(--mut);padding:20px;line-height:1.7">לא זוהו קודי מוצר בקטלוג.<br>ייתכן שה-PDF הוא תמונה ללא שכבת טקסט. אפשר להוסיף מוצרים ידנית.</div><button class="cta" id="ci_man">+ הוספת מוצר ידנית</button>';if($('ci_man'))$('ci_man').onclick=function(){ov.remove();editProduct({__new:true});};return;}
  var h='<div class="card" style="background:var(--accs);font-size:12.5px;color:var(--accd)">זוהו <b>'+products.length+'</b> מוצרים מתוך '+pages.length+' עמודים. בדקי ותקני, סמני מה לכלול, ואשרי:</div>';
  products.forEach(function(pr,ix){var thumb=pages.filter(function(p){return p.idx===pr.slides[0];})[0];
   h+='<div class="card" id="cip_'+ix+'"><div style="display:flex;gap:10px"><img src="'+(thumb?thumb.dataUrl:'')+'" style="width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line);flex:none"><div style="flex:1;min-width:0"><label style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;cursor:pointer"><input type="checkbox" class="ci_inc" data-ix="'+ix+'" checked> כלול · '+pr.slides.length+' שקפים</label><input class="ci_sku field" data-ix="'+ix+'" value="'+esc(pr.sku)+'" style="margin-top:5px;font-size:12.5px" placeholder="מק״ט"></div></div><input class="ci_name field" data-ix="'+ix+'" value="'+esc(pr.name)+'" style="margin-top:8px;font-size:12.5px" placeholder="שם מוצר"><div style="display:flex;gap:8px;margin-top:8px"><input class="ci_bc field" data-ix="'+ix+'" value="'+esc(pr.barcode)+'" style="flex:1;font-size:12px" placeholder="ברקוד" inputmode="numeric"><input class="ci_price field" data-ix="'+ix+'" value="" style="width:110px;font-size:12px" placeholder="מחיר לסוכן ₪" inputmode="decimal"></div></div>';
  });
  h+='<button class="cta" id="ci_create">✓ אישור ויצירת המוצרים</button><div id="ci_cprog" style="text-align:center;color:var(--mut);font-size:12.5px;margin-top:9px;line-height:1.6"></div>';
  $('cibody').innerHTML=h;$('ci_create').onclick=doCreate;
 }
 function createOne(pr,ts){
  var bucket=sb.storage.from('product-images'),slideUrls=[];
  function upSlide(k){
   if(k>=pr.slides.length)return Promise.resolve();
   var pg=pages.filter(function(p){return p.idx===pr.slides[k];})[0];
   var blob=_dataURLtoBlob(pg.dataUrl),path='catalog-import/'+ts+'/'+_safeSku(pr.sku)+'_'+k+'.jpg';
   return bucket.upload(path,blob,{contentType:'image/jpeg',upsert:true}).then(function(u){if(u&&u.error)throw u.error;slideUrls.push(bucket.getPublicUrl(path).data.publicUrl);return upSlide(k+1);});
  }
  return upSlide(0).then(function(){
   var fields={sku:pr.sku,name:pr.name||pr.sku,category:'pharmacy',barcode:pr.barcode||null,in_catalog:true,is_active:true};
   return sb.from('liberty_products_edit').select('id').eq('sku',pr.sku).maybeSingle().then(function(ex){
    if(ex&&ex.data&&ex.data.id){var pid=ex.data.id;return sb.from('liberty_products_edit').update(fields).eq('id',pid).then(function(){return pid;});}
    return sb.from('liberty_products_edit').insert(fields).select('id').single().then(function(r){if(r.error)throw r.error;return r.data.id;});
   }).then(function(pid){
    var steps=[];
    if(pr.price!==''){var pa=Math.round(parseFloat(pr.price)*100);if(!isNaN(pa)&&pa>=0)steps.push(sb.from('liberty_catalog_items_edit').upsert({catalog_id:PHARM_CAT,product_id:pid,price_agorot:pa},{onConflict:'catalog_id,product_id'}));}
    steps.push(sb.from('liberty_product_images').upsert({sku:pr.sku,data_url:slideUrls[0]},{onConflict:'sku'}));
    return Promise.all(steps).then(function(){
     imgMap[pr.sku]=slideUrls[0];
     return sb.from('liberty_product_pages').delete().eq('sku',pr.sku).then(function(){
      var rows=slideUrls.map(function(u,k){return {sku:pr.sku,page:900+k,url:u,sort:k};});
      return sb.from('liberty_product_pages').insert(rows);
     });
    });
   });
  });
 }
 function doCreate(){
  products.forEach(function(pr,ix){pr.include=fieldChk('ci_inc',ix);pr.sku=fieldVal('ci_sku',ix);pr.name=fieldVal('ci_name',ix);pr.barcode=fieldVal('ci_bc',ix);pr.price=fieldVal('ci_price',ix);});
  var todo=products.filter(function(p){return p.include&&p.sku;});
  if(!todo.length){toast('אין מוצרים מסומנים לאישור');return;}
  var btn=$('ci_create');btn.disabled=true;btn.textContent='מייבא…';
  var ts=Date.now(),i=0;
  function nextProd(){
   if(i>=todo.length){$('ci_cprog').innerHTML='<span style="color:var(--good)">✓ '+todo.length+' מוצרים נוצרו/עודכנו בהצלחה</span>';toast('הקטלוג יובא ✓');setTimeout(function(){ov.remove();route='prodadmin';render();},1300);return;}
   var pr=todo[i];$('ci_cprog').textContent='יוצר '+(i+1)+' / '+todo.length+' · '+pr.sku+' …';
   createOne(pr,ts).then(function(){i++;nextProd();},function(e){$('ci_cprog').innerHTML='<span style="color:var(--bad)">שגיאה במוצר '+esc(pr.sku)+': '+esc(''+(e&&e.message||e))+'</span>';btn.disabled=false;btn.textContent='נסי שוב';});
  }
  nextProd();
 }
 screenPick();
}
render();
</script>
