*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Heebo',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

#nav{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:20}

.thumbph{width:48px;height:48px;border-radius:10px;background:#f2efe9;flex:none;display:flex;align-items:center;justify-content:center}
.step{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:32px;height:32px;border:none;background:#f7f5f2;font-size:18px;font-weight:800;color:var(--acc);cursor:pointer}
.step span{min-width:34px;text-align:center;font-weight:800;font-size:15px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#24211d;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.field{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;font-size:15px;font-weight:600;background:#fff}
textarea.field{height:auto;min-height:80px;padding:11px 13px;resize:vertical}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}

.ovl{position:fixed;inset:0;background:rgba(36,33,29,.4);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}

function hav(a,b){var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(la1)*Math.cos(la2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nnOrder(stops,origin){var pts=stops.filter(function(s){return s.lat!=null&&s.lng!=null});var rest=stops.filter(function(s){return s.lat==null||s.lng==null});var out=[],cur=origin;while(pts.length){var bi=0,bd=1e9;for(var i=0;i<pts.length;i++){var d=hav(cur,pts[i]);if(d<bd){bd=d;bi=i}}cur=pts[bi];out.push(pts[bi]);pts.splice(bi,1)}return out.concat(rest)}

var tmr=null;
function catalogView(){
 shell('<div class="hdr"><div class="h1">קטלוג</div><div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#857f76" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q" placeholder="שם מוצר או מק״ט…" autofocus></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 function run(){var q=$('q').value.trim();var query=sb.from('liberty_products').select('sku,name,brand,pack_size,is_commissionable,is_teaser,price_agorot,bonus_buy,bonus_get').order('sku').limit(80);if(q)query=query.or('name.ilike.%'+q+'%,sku.ilike.%'+q+'%,barcode.ilike.%'+q+'%');query.then(function(r){var d=r.data||[],h='';for(var i=0;i<d.length;i++){var p=d[i];var b='';if(p.is_teaser)b+='<span class="badge b-acc">בקרוב</span> ';if(p.bonus_buy!=null&&p.bonus_get>0)b+='<span class="badge b-warn">בונוס '+p.bonus_buy+'+'+p.bonus_get+'</span> ';if(p.is_commissionable===true)b+='<span class="badge b-good">מזכה בעמלה</span>';if(p.is_commissionable===false)b+='<span class="badge b-mut">ללא עמלה</span>';h+='<div class="card" style="display:flex;align-items:center;gap:11px">'+thumb(p.sku)+'<div style="flex:1;min-width:0"><div style="font-size:11.5px;color:var(--mut);font-weight:700">'+esc(p.sku)+(p.brand?' · '+esc(p.brand):'')+(p.pack_size?' · אריזה '+p.pack_size:'')+'</div><div style="font-size:14px;font-weight:700;line-height:1.3">'+esc(p.name)+'</div><div style="margin-top:5px">'+b+'</div></div><div style="text-align:left"><div style="font-size:17px;font-weight:800;color:var(--acc);white-space:nowrap">'+ils(p.price_agorot)+'</div><button class="addp" data-sku="'+esc(p.sku)+'" style="margin-top:6px;border:none;background:var(--accs);color:var(--accd);font-weight:800;font-size:13px;border-radius:9px;padding:5px 12px;cursor:pointer">+ הזמנה</button></div></div>'}$('res').innerHTML=h||'<div style="color:var(--mut);font-size:13px">לא נמצאו מוצרים</div>';var ap=document.querySelectorAll('.addp');for(var j=0;j<ap.length;j++){ap[j].onclick=function(){addToCartBySku(this.getAttribute('data-sku'))}}})}

function addToCartBySku(sku){

// ---------- TARGETS ----------
function targetsView(){
 shell('<div class="hdr"><div class="h1">יעדים ועמלות</div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 var mStart=new Date();mStart=new Date(mStart.getFullYear(),mStart.getMonth(),1).toISOString();
 Promise.all([
  sb.from('liberty_my_target').select('target_agorot,commission_pct').limit(1),
  sb.from('liberty_my_orders').select('commissionable_agorot,total_agorot,created_at').gte('created_at',mStart)
 ]).then(function(res){
  var tg=(res[0].data||[])[0];var orders=res[1].data||[];
  var achieved=0,sales=0;orders.forEach(function(o){achieved+=o.commissionable_agorot||0;sales+=o.total_agorot||0});
  var target=tg?tg.target_agorot:0;var pct=tg?tg.commission_pct:0;
  var prog=target>0?Math.min(100,Math.round(achieved/target*100)):0;
  var commission=Math.round(achieved*pct/100);
  var remain=Math.max(0,target-achieved);
  var h='<div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">יעד חודשי (מוצרי בית)</div><div style="font-size:15px;font-weight:800;margin:2px 0 10px">'+ils(achieved)+' <span style="color:var(--mut);font-weight:600">מתוך '+ils(target)+'</span></div><div class="bar"><div style="width:'+prog+'%"></div></div><div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12px"><b style="color:var(--acc)">'+prog+'%</b><span style="color:var(--mut)">נותרו '+ils(remain)+'</span></div></div>'+
   '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">עמלה צפויה</div><div style="font-size:22px;font-weight:800;color:var(--good)">'+ils(commission)+'</div><div style="font-size:11px;color:var(--mut)">'+pct+'% ממוצרי הבית</div></div><div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">סה״כ מכירות החודש</div><div style="font-size:22px;font-weight:800;color:var(--acc)">'+ils(sales)+'</div><div style="font-size:11px;color:var(--mut)">'+orders.length+' הזמנות</div></div></div>'+
   '<div class="card" style="background:var(--accs);font-size:12.5px;color:var(--accd);line-height:1.5">העמלה מחושבת ממוצרי הבית בלבד (פראש גאם, MO, ווטס וכו׳) — לא מוצרי שוורץ/דורקס. היעד ניתן לעדכון ע״י המשרד.</div>';
  $('res').innerHTML=h;
 });
}

})}
