function hav(a,b){var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(la1)*Math.cos(la2);return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}

function archiveStaleRoutes(cb){
 if(!me){cb&&cb();return}
 sb.from('daily_routes').select('*').eq('agent_id',me.id).eq('status','active').lt('route_date',todayStr()).then(function(r){
  var stale=r.data||[];if(!stale.length){cb&&cb();return}
  var since=new Date(Date.now()-45*86400000).toISOString();
  Promise.all([
   sb.from('liberty_my_orders').select('total_agorot,created_at').gte('created_at',since),
   sb.from('liberty_my_visits').select('arrived_at').gte('arrived_at',since),
   sb.from('payments').select('amount_agorot,created_at,collected_by').gte('created_at',since)
  ]).then(function(res){
   var orders=(res[0].data||[]),visits=(res[1].data||[]),pays=(res[2].data||[]);
   var chain=Promise.resolve();
   stale.forEach(function(row){
    var dt=row.route_date;
    var oo=orders.filter(function(o){return localDate(o.created_at)===dt});
    var vv=visits.filter(function(v){return v.arrived_at&&localDate(v.arrived_at)===dt});
    var pp=pays.filter(function(p){return localDate(p.created_at)===dt&&(!me||!p.collected_by||p.collected_by===me.id)});
    var report={planned:(row.selected_ids||[]).length,visited:vv.length,orders:oo.length,orders_sum:oo.reduce(function(s,o){return s+(o.total_agorot||0)},0),collected:pp.reduce(function(s,p){return s+(p.amount_agorot||0)},0)};
    chain=chain.then(function(){return sb.from('daily_routes').update({status:'archived',report:report,updated_at:new Date().toISOString()}).eq('id',row.id)});
   });
   chain.then(function(){cb&&cb()});
  });
 });
}

 if($('vchg'))$('vchg').onclick=openVisitPicker;
 $('savevis').onclick=function(){if(!visitTarget||!me)return;$('savevis').disabled=true;$('savevis').textContent='שומר…';var rec={customer_id:visitTarget.id,agent_id:me.id,arrived_at:new Date().toISOString(),outcome:outcome,summary:$('vsum').value.trim()||null};var nx=$('vnext').value;if(nx)rec.next_visit_date=nx;sb.from('visits').insert(rec).then(function(r){if(r.error){toast('שגיאה בשמירה: '+r.error.message);$('savevis').disabled=false;$('savevis').textContent='שמירת ביקור'}else{toast('הביקור נשמר ✓');visitTarget=null;render()}})};
 sb.from('liberty_my_visits').select('customer_name,outcome,summary,arrived_at,next_visit_date').order('arrived_at',{ascending:false}).limit(30).then(function(r){var d=r.data||[],h='';d.forEach(function(v){var dt=v.arrived_at?new Date(v.arrived_at).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}):'';h+='<div class="card" style="padding:11px 13px"><div style="display:flex;justify-content:space-between"><b style="font-size:13.5px">'+esc(v.customer_name)+'</b><span style="font-size:11.5px;color:var(--mut)">'+dt+'</span></div><div style="font-size:12px;margin-top:3px"><span class="badge b-mut">'+esc(v.outcome||'—')+'</span> '+(v.summary?esc(v.summary):'')+'</div>'+(v.next_visit_date?'<div style="font-size:11.5px;color:var(--warn);margin-top:4px">↻ ביקור הבא: '+v.next_visit_date+'</div>':'')+'</div>'});$('vhist').innerHTML=h||'<div style="color:var(--mut);font-size:13px">אין ביקורים עדיין.</div>'});
}
function openVisitPicker(){
 var o=document.createElement('div');o.className='ovl';o.innerHTML='<div class="sheet"><div style="padding:14px 16px 8px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">בחירת לקוח</b><span id="vpx" style="font-size:22px;cursor:pointer;color:var(--mut)">×</span></div><div class="search" style="margin-top:10px"><input id="vpq" placeholder="שם או עיר…" autofocus></div></div><div id="vpl" class="list" style="overflow:auto"></div></div>';document.body.appendChild(o);
 o.onclick=function(e){if(e.target===o)o.remove()};$('vpx').onclick=function(){o.remove()};
 function run(){var q=$('vpq').value.trim();var qu=sb.from('liberty_customers').select('id,name,city').order('name').limit(60);if(q)qu=qu.or('name.ilike.%'+q+'%,city.ilike.%'+q+'%');qu.then(function(r){var h='';(r.data||[]).forEach(function(c){h+='<div class="card vpi" data-id="'+c.id+'" data-name="'+esc(c.name)+'" style="cursor:pointer"><div style="font-size:14px;font-weight:700">'+esc(c.name)+'</div><div style="font-size:12px;color:var(--mut)">'+esc(c.city||'')+'</div></div>'});$('vpl').innerHTML=h;var vi=document.querySelectorAll('.vpi');for(var i=0;i<vi.length;i++){vi[i].onclick=function(){visitTarget={id:this.getAttribute('data-id'),name:this.getAttribute('data-name')};o.remove();render()}}})}
 $('vpq').addEventListener('input',function(){clearTimeout(tmr);tmr=setTimeout(run,150)});run();
}

// ---------- TARGETS ----------
function targetsView(){
 shell('<div class="hdr"><div class="h1">יעדים ועמלות</div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 var mStart=new Date();mStart=new Date(mStart.getFullYear(),mStart.getMonth(),1).toISOString();
 sb.from('liberty_my_orders').select('commissionable_agorot,total_agorot,created_at').gte('created_at',mStart).then(function(res){
  var orders=res.data||[];
  var achieved=0,sales=0;orders.forEach(function(o){achieved+=o.commissionable_agorot||0;sales+=o.total_agorot||0});
  var T2=7500000,T3=8500000; // 75K -> 2%, 85K -> 3%
  var rate=commRate(achieved);
  var commission=Math.round(achieved*rate/100);
  // progress toward the two milestones
  var prog2=Math.min(100,Math.round(achieved/T2*100));
  var prog3=Math.min(100,Math.round(achieved/T3*100));
  var nextLabel,nextRemain,nextRate;
  if(achieved<T2){nextLabel='לעמלת 2%';nextRemain=T2-achieved;nextRate=2}
  else if(achieved<T3){nextLabel='לעמלת 3%';nextRemain=T3-achieved;nextRate=3}
  else{nextLabel=null;nextRemain=0;nextRate=3}
  var rateBadge=rate>0?'<span class="badge b-good">עמלה פעילה '+rate+'%</span>':'<span class="badge b-warn">טרם הופעלה עמלה</span>';
  function milestone(label,amt,prog,active,earnedNote){return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:13px;font-weight:800">'+label+'</div>'+(active?'<span class="badge b-good">✓ הושג</span>':'<span class="badge b-mut">'+prog+'%</span>')+'</div><div class="bar"><div style="width:'+prog+'%;'+(active?'background:var(--good)':'')+'"></div></div><div style="display:flex;justify-content:space-between;margin-top:7px;font-size:12px"><span style="color:var(--mut)">'+ils(achieved)+' / '+ils(amt)+'</span><span style="color:var(--mut)">'+earnedNote+'</span></div></div>'}
  var h='<div class="card" style="background:var(--acc);color:#fff"><div style="font-size:12px;color:#bfe0e3;font-weight:700">מכירות מזכות החודש (מוצרי בית)</div><div style="font-size:28px;font-weight:800;margin:3px 0">'+ils(achieved)+'</div>'+rateBadge+'</div>'+
   '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">עמלה צפויה כרגע</div><div style="font-size:22px;font-weight:800;color:var(--good)">'+ils(commission)+'</div><div style="font-size:11px;color:var(--mut)">'+(rate>0?rate+'% ממוצרי הבית':'עדיין 0%')+'</div></div><div class="card"><div style="font-size:12px;color:var(--mut);font-weight:700">סה״כ מכירות החודש</div><div style="font-size:22px;font-weight:800;color:var(--acc)">'+ils(sales)+'</div><div style="font-size:11px;color:var(--mut)">'+orders.length+' הזמנות</div></div></div>'+
   (nextLabel?'<div class="card" style="background:var(--warn-s)"><div style="font-size:12.5px;color:var(--warn);font-weight:800">🎯 עוד '+ils(nextRemain)+' '+nextLabel+'</div><div style="font-size:11.5px;color:var(--warn);margin-top:3px">כשתעברי, כל המכירות המזכות יזכו ב-'+nextRate+'% = '+ils(Math.round(achieved*nextRate/100))+' (על הבסיס הנוכחי)</div></div>':'<div class="card" style="background:var(--good-s)"><div style="font-size:12.5px;color:var(--good);font-weight:800">🏆 עברת את יעד ה-3%! עמלה מלאה על כל המכירות המזכות.</div></div>')+
   milestone('יעד ראשון · 75,000 ₪ (2%)',T2,prog2,achieved>=T2,achieved>=T2?'עמלה: '+ils(Math.round(achieved*0.02)):'2% על הכל')+
   milestone('יעד שני · 85,000 ₪ (3%)',T3,prog3,achieved>=T3,achieved>=T3?'עמלה: '+ils(Math.round(achieved*0.03)):'3% על הכל')+
   '<div class="card" style="background:var(--accs);font-size:12.5px;color:var(--accd);line-height:1.5">מדרגות העמלה: מתחת ל-75,000 ₪ אין עמלה · מ-75,000 ₪ → 2% · מעל 85,000 ₪ → 3%. העמלה מחושבת ממוצרי הבית בלבד (פראש גאם, MO, ווטס וכו׳) — לא שוורץ/דורקס.</div>';
  $('res').innerHTML=h;
 });
}

// ---------- WORK REPORTS ----------
function reportsView(){
 var now=new Date();var y=now.getFullYear(),m=now.getMonth();
 var from=window.__rfrom||(new Date(y,m,1).toISOString().slice(0,10));
 var to=window.__rto||now.toISOString().slice(0,10);
 shell('<div class="hdr"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'+backBtn()+'<div class="h1" style="margin:0">דוח עבודה</div></div><div style="display:flex;gap:8px;align-items:end"><label style="flex:1"><span style="font-size:11px;color:var(--mut);font-weight:600">מתאריך</span><input id="rf" type="date" class="field" value="'+from+'"></label><label style="flex:1"><span style="font-size:11px;color:var(--mut);font-weight:600">עד</span><input id="rt" type="date" class="field" value="'+to+'"></label><button id="rgen" class="cta" style="width:auto;height:48px;padding:0 16px">הפק</button></div></div><div class="list" id="rbody"><div style="color:var(--mut);font-size:13px">בחרי טווח תאריכים ולחצי "הפק".</div></div>');
 $('rgen').onclick=function(){window.__rfrom=$('rf').value;window.__rto=$('rt').value;genReport()};
 genReport();
}
function genReport(){
 var from=$('rf').value,to=$('rt').value;if(!from||!to)return;
 var lo=from+'T00:00:00',hi=to+'T23:59:59';
 $('rbody').innerHTML='<div style="color:var(--mut);font-size:13px">מפיק…</div>';
 Promise.all([
  sb.from('liberty_my_visits').select('customer_id,customer_name,outcome,summary,arrived_at,next_visit_date').gte('arrived_at',lo).lte('arrived_at',hi).order('arrived_at',{ascending:false}),
  sb.from('liberty_my_orders').select('customer_id,customer_name,total_agorot,commissionable_agorot,created_at').gte('created_at',lo).lte('created_at',hi)
 ]).then(function(res){
  var visits=res[0].data||[],orders=res[1].data||[];
  var sold=0,commTot=0;orders.forEach(function(o){sold+=o.total_agorot||0;commTot+=o.commissionable_agorot||0});
  // map orders by customer+day
  function dk(cid,dt){return cid+'|'+(''+dt).slice(0,10)}
  var ordMap={};orders.forEach(function(o){var k=dk(o.customer_id,o.created_at);ordMap[k]=(ordMap[k]||0)+ (o.total_agorot||0)});
  var potential=0;
  var vh='';
  visits.forEach(function(v){var amt=ordMap[dk(v.customer_id,v.arrived_at)]||0;var isPot=(!amt&&(v.outcome==='פוטנציאלי'||v.outcome==='ללא הזמנה'));if(isPot)potential++;
   var badge=amt>0?'<span class="badge b-good">נמכר '+ils(amt)+'</span>':(isPot?'<span class="badge b-warn">פוטנציאל</span>':'<span class="badge b-mut">'+esc(v.outcome||'—')+'</span>');
   vh+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:700">'+esc(v.customer_name)+'</div><div style="font-size:11.5px;color:var(--mut)">'+fmtDate(v.arrived_at)+' · '+esc(v.outcome||'')+'</div></div>'+badge+'</div>'+(v.summary?'<div style="margin-top:7px;font-size:12.5px;color:#6b655c;line-height:1.5">'+esc(v.summary)+'</div>':'')+(v.next_visit_date?'<div style="font-size:11.5px;color:var(--warn);margin-top:4px">↻ ביקור הבא: '+v.next_visit_date+'</div>':'')+'</div>';
  });
  // orders without a matching visit (direct)
  var stat='<div class="card" style="background:#fbfaf8"><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><div><div style="font-size:11px;color:var(--mut);font-weight:700">ביקורים</div><div style="font-size:22px;font-weight:800">'+visits.length+'</div></div><div><div style="font-size:11px;color:var(--mut);font-weight:700">הזמנות</div><div style="font-size:22px;font-weight:800">'+orders.length+'</div></div><div><div style="font-size:11px;color:var(--mut);font-weight:700">נמכר</div><div style="font-size:22px;font-weight:800;color:var(--good)">'+ils(sold)+'</div></div><div><div style="font-size:11px;color:var(--mut);font-weight:700">פוטנציאל</div><div style="font-size:22px;font-weight:800;color:var(--warn)">'+potential+'</div></div></div><div style="margin-top:8px;font-size:12px;color:var(--mut)">מזכה בעמלה בטווח: <b style="color:var(--good)">'+ils(commTot)+'</b></div></div>';
  var actions='<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><button id="rprint" class="cta" style="height:44px;background:var(--accs);color:var(--accd)">🖨️ הדפסה / PDF</button><button id="rshare" class="cta" style="height:44px;background:#25d366;color:#fff">💬 שיתוף</button></div>';
  $('rbody').innerHTML=stat+actions+(vh||'<div class="card" style="text-align:center;color:var(--mut);font-size:13px;padding:20px">אין ביקורים בטווח זה.</div>');
  window.__reportText='דוח עבודה '+from+' עד '+to+'\n'+visits.length+' ביקורים · '+orders.length+' הזמנות · נמכר '+ils(sold)+' · '+potential+' פוטנציאל\n\n'+visits.map(function(v){var amt=ordMap[dk(v.customer_id,v.arrived_at)]||0;return '• '+v.customer_name+' ('+fmtDate(v.arrived_at)+') — '+(v.outcome||'')+(amt>0?' · נמכר '+ils(amt):'')+(v.summary?': '+v.summary:'')}).join('\n');
  $('rprint').onclick=function(){window.print()};
  $('rshare').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(window.__reportText),'_blank')};
 });
}
function render(){sb.auth.getSession().then(function(r){if(!r.data.session){loginView();return}if(!me){boot();return}
 if(_hist[_hist.length-1]!==route)_hist.push(route);
 if(route==='catalog')catalogView();
 else if(route==='customers')customersView();
 else if(route==='collections')collectionsView();
 else if(route==='orders')ordersView();
 else if(route==='myorders')myOrdersView();
 else if(route==='route')routeView();
 else if(route==='visits')visitsView();
 else if(route==='targets')targetsView();
 else if(route==='customer')customerView();
 else if(route==='reports')reportsView();
 else if(route==='newcust')newCustomerView();
 else if(route==='areas')areasView();
 else if(route==='broadcast')broadcastView();
 else if(route==='dayhist')dayHistView();
 else homeView();
})}
function drPill(label,val,color){return '<div style="background:#fbfaf8;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:66px"><div style="font-size:10px;color:var(--mut);font-weight:700">'+label+'</div><div style="font-size:15px;font-weight:800;color:'+color+'">'+val+'</div></div>'}
function dayHistView(){
 shell('<div class="hdr"><div style="display:flex;align-items:center;gap:8px">'+backBtn()+'<div class="h1" style="margin:0">היסטוריית מסלולים</div></div></div><div class="list" id="res"><div style="color:var(--mut);font-size:13px">טוען…</div></div>');
 if(!me){$('res').innerHTML='<div style="color:var(--mut);font-size:13px;text-align:center;padding:24px">טוען…</div>';return}
 sb.from('daily_routes').select('route_date,area_code,selected_ids,report').eq('agent_id',me.id).eq('status','archived').order('route_date',{ascending:false}).limit(90).then(function(r){
  var d=r.data||[];
  if(!d.length){$('res').innerHTML='<div class="card" style="text-align:center;color:var(--mut);font-size:13px;padding:24px;line-height:1.6">אין עדיין ימים בהיסטוריה.<br>המסלול והדו״ח היומי יישמרו כאן אוטומטית בסוף כל יום.</div>';return}
  var h='';
  d.forEach(function(row){
   var rep=row.report||{};
   var dt=new Date(row.route_date+'T00:00:00').toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'numeric',year:'2-digit'});
   h+='<div class="card" style="display:flex;flex-direction:column;gap:9px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:14.5px;font-weight:800">'+dt+'</div>'+(row.area_code?'<span class="badge b-mut">אזור '+row.area_code+'</span>':'')+'</div><div style="display:flex;gap:7px;flex-wrap:wrap">'+drPill('תוכננו',(rep.planned!=null?rep.planned:(row.selected_ids||[]).length),'var(--acc)')+drPill('ביקורים',rep.visited||0,'var(--good)')+drPill('הזמנות',rep.orders||0,'var(--acc)')+drPill('סכום',ils(rep.orders_sum||0),'var(--accd)')+drPill('נגבה',ils(rep.collected||0),'var(--bad)')+'</div></div>';
  });
  $('res').innerHTML=h;
 });
}
render();
</script>
</body>
